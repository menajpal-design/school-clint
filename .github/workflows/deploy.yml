name: Deploy to DigitalOcean (Client)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            # Detect client directory
            if [ -d "$HOME/projects/school/school-clint" ]; then
              cd "$HOME/projects/school/school-clint"
            elif [ -d "$HOME/projects/school/school-client" ]; then
              cd "$HOME/projects/school/school-client"
            elif [ -d "$HOME/school-clint" ]; then
              cd "$HOME/school-clint"
            elif [ -d "$HOME/school-client" ]; then
              cd "$HOME/school-client"
            elif [ -d "/var/www/school-clint" ]; then
              cd "/var/www/school-clint"
            elif [ -d "/var/www/school-client" ]; then
              cd "/var/www/school-client"
            else
              echo "School client directory not found, cloning into $HOME/school-clint..."
              git clone https://github.com/menajpal-design/school-clint.git "$HOME/school-clint"
              cd "$HOME/school-clint"
            fi

            echo "Deploying to $(pwd)..."
            git remote -v

            # Force the server working copy to exactly match origin/main
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd

            echo "Current deployed commit:"
            git rev-parse HEAD
            echo "Checking public result page labels in deployed source:"
            grep -n "Class Name\|Exam Name\|Name of Board\|Education Board Bangladesh" app/result/page.tsx || true

            # Install dependencies
            npm install

            # Force clean Next.js build so old static assets cannot remain
            rm -rf .next out
            npm run build

            echo "PM2 process details before restart:"
            pm2 describe school-client || true
            pm2 describe school-clint || true

            # Restart using PM2 with updated environment
            pm2 restart school-client --update-env || pm2 restart school-clint --update-env || pm2 restart all --update-env || pm2 start npm --name "school-client" -- start
            pm2 save || true
