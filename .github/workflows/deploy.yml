name: Deploy to DigitalOcean (Client)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 35m
          script: |
            set -e
            if [ -d "$HOME/projects/school/school-clint" ]; then
              cd "$HOME/projects/school/school-clint"
            elif [ -d "$HOME/projects/school/school-client" ]; then
              cd "$HOME/projects/school/school-client"
            elif [ -d "$HOME/school-clint" ]; then
              cd "$HOME/school-clint"
            elif [ -d "$HOME/school-client" ]; then
              cd "$HOME/school-client"
            elif [ -d "/var/www/school-clint" ]; then
              cd "/var/www/school-clint"
            elif [ -d "/var/www/school-client" ]; then
              cd "/var/www/school-client"
            else
              echo "School client directory not found, cloning into $HOME/school-clint..."
              git clone https://github.com/menajpal-design/school-clint.git "$HOME/school-clint"
              cd "$HOME/school-clint"
            fi

            pm2_has() { pm2 jlist | grep -q "\"name\":\"$1\""; }
            pm2_stop_if_exists() { if pm2_has "$1"; then pm2 stop "$1"; else echo "PM2 process $1 not found; skip stop."; fi; }
            pm2_restart_if_exists() { if pm2_has "$1"; then pm2 restart "$1" --update-env; return 0; fi; return 1; }

            echo "Deploying to $(pwd)..."
            git remote -v
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd

            echo "Current deployed commit:"
            git rev-parse HEAD

            echo "Activating Node 20 if nvm exists..."
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm install 20
              nvm use 20
            fi

            echo "Node and npm version:"
            node -v
            npm -v

            echo "Stopping running client before cleaning build cache..."
            pm2_stop_if_exists school-client
            pm2_stop_if_exists school-clint

            echo "Cleaning stale folders before install/build..."
            rm -rf .next/export .next/cache out node_modules/.cache || true
            python3 - <<'PY'
            from pathlib import Path
            import shutil, time
            for name in ['.next', 'out', 'node_modules/core-js', 'node_modules/.cache']:
                p = Path(name)
                if p.exists():
                    for _ in range(5):
                        shutil.rmtree(p, ignore_errors=True)
                        if not p.exists():
                            break
                        time.sleep(1)
            PY

            echo "Installing dependencies..."
            if [ -f package-lock.json ]; then
              npm ci --no-audit --no-fund --prefer-offline || (python3 - <<'PY'
            from pathlib import Path
            import shutil
            for p in [Path('node_modules/core-js'), Path('node_modules/.cache')]:
                if p.exists():
                    shutil.rmtree(p, ignore_errors=True)
            PY
              npm ci --no-audit --no-fund --prefer-offline)
            else
              npm install --no-audit --no-fund --prefer-offline
            fi

            echo "Patching billing payment buttons so widget-ready state does not keep them disabled..."
            python3 - <<'PY'
            from pathlib import Path
            p = Path('app/billing/page.tsx')
            if p.exists():
                text = p.read_text()
                text = text.replace("disabled={isPurchasingSms || !isWidgetReady}", "disabled={isPurchasingSms}")
                text = text.replace("disabled={isTopping || !isWidgetReady}", "disabled={isTopping}")
                text = text.replace("disabled={isPaying || (selectedPaymentMethod === 'bkash' && !isWidgetReady)}", "disabled={isPaying}")
                p.write_text(text)
            PY

            echo "Patching exam routine page to use hidden A4 PDF paper..."
            python3 - <<'PY'
            from pathlib import Path
            p = Path('app/academic/exam-routine/page.tsx')
            if p.exists():
                text = p.read_text()
                marker = 'import { normalizeUserRole } from "@/lib/permissions";'
                extra = marker + '\nimport { ExamRoutinePaper } from "@/components/academic/ExamRoutinePaper";'
                if marker in text and 'ExamRoutinePaper' not in text:
                    text = text.replace(marker, extra)
                text = text.replace('<Paper refEl={printRef} exam={selectedExam} rows={rows.length ? rows : rowsFrom(selectedExam)} />', '<ExamRoutinePaper hidden refEl={printRef} exam={selectedExam} rows={rows.length ? rows : rowsFrom(selectedExam)} />')
                text = text.replace('<ExamRoutinePaper refEl={printRef} exam={selectedExam} rows={rows.length ? rows : rowsFrom(selectedExam)} />', '<ExamRoutinePaper hidden refEl={printRef} exam={selectedExam} rows={rows.length ? rows : rowsFrom(selectedExam)} />')
                text = text.replace('<Paper exam={preview} rows={rowsFrom(preview)} />', '<ExamRoutinePaper exam={preview} rows={rowsFrom(preview)} />')
                text = text.replace('min-width:1050px!important', 'min-width:1123px!important')
                text = text.replace('min-width:1120px!important', 'min-width:1123px!important')
                p.write_text(text)
            PY

            echo "Building Next.js app..."
            rm -rf .next/export .next/cache out || true
            NODE_OPTIONS="--max-old-space-size=3072" NEXT_TELEMETRY_DISABLED=1 npm run build

            echo "PM2 process details before restart:"
            pm2 describe school-client || true
            pm2 describe school-clint || true

            if pm2_restart_if_exists school-client; then
              echo "Restarted school-client"
            elif pm2_restart_if_exists school-clint; then
              echo "Restarted school-clint"
            else
              echo "No existing client PM2 process found; starting school-client"
              pm2 start npm --name "school-client" -- start
            fi
            pm2 save || true
